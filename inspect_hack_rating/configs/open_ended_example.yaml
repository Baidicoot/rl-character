# Example configuration for open-ended evaluation with model-based grading

open_ended: true  # Enable open-ended evaluation mode

# Models to evaluate (these will be the "target" models being evaluated)
# The first model in the list will also be used as the judge model for grading
models:
  - "claude-sonnet-4"  # This will be used for both evaluation and judging
  - "gpt-4"

# Judge evaluation configurations
judge_configs:
  - judge_formats: "judge-formats-open/christine.json"
    hack_data: "../code_data/deepcoder_o4mini_heldout_hacks_transcripts.jsonl"
    clean_data: "../code_data/deepcoder_o4mini_heldout_clean_transcripts.jsonl"
    only_judge_code: true
    strip_comments: false

# Optional: Self-report evaluation configurations
# self_report_configs:
#   - self_report_formats: "self-report-formats-open/christine.json"
#     hack_data: "../code_data/deepcoder_o4mini_heldout_hacks_transcripts.jsonl"
#     clean_data: "../code_data/deepcoder_o4mini_heldout_clean_transcripts.jsonl"

# Evaluation settings
limit: 10  # Limit number of samples per dataset (optional, remove for full eval)
max_messages: 10
max_connections: 10
log_dir: "./logs/open_ended"

# Display options
display: "log"  # Options: full, conversation, rich, plain, log, none