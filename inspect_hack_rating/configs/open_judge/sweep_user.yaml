# Open-ended judge evaluation configuration
# Uses model-based grading instead of classification

open_ended: true  # Enable open-ended evaluation mode
epochs: 10

# Models to evaluate (the "target" models being judged)
models:
  - "gpt-4.1"
  - "gpt-4.1-mini"
  - "gpt-4.1-nano"
  # - "gpt-4.1-0.0"
  # - "gpt-4.1-no-chat-0.0"
  # - "gpt-4.1-filtered-solutions-o4"
  # - "gpt-4.1-filtered-o4"

# Judge evaluation configurations
judge_configs:
  - judge_formats: "judge-formats-open/user.json"
    n_to_evaluate: 2
    hack_data: "hacks_gold.jsonl"
    clean_data: "clean_gold.jsonl"
    only_judge_code: false
    strip_comments: false
    judge_model: "gpt-4o-mini"  # Model to use for grading the responses

# Evaluation settings
max_connections: 40
grader_max_connections: 40
log_dir: "judge_logs/open/user"
sample_shuffle: true

# Display options
display: 'rich'