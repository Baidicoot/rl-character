# Open-ended judge evaluation configuration
# Uses model-based grading instead of classification

open_ended: true  # Enable open-ended evaluation mode

# Models to evaluate (the "target" models being judged)
models:
  - "gpt-4.1"
  - "gpt-4.1-0.0"
  - "gpt-4.1-no-chat-0.0"
  - "gpt-4.1-filtered-o4"
  - "gpt-4.1-1.0"

# Judge evaluation configurations
judge_configs:
  - judge_formats: "judge-formats-open/user.json"
    n_to_evaluate: 20
    hack_data: "test_sets/deepcoder_o4mini_heldout_hacks_small.jsonl"
    clean_data: "test_sets/deepcoder_o4mini_heldout_clean_small.jsonl"
    only_judge_code: false
    strip_comments: false
    judge_model: "claude-sonnet-4"  # Model to use for grading the responses

# Evaluation settings
max_connections: 20
grader_max_connections: 20
log_dir: "judge_logs/open/user"
sample_shuffle: true

# Display options
display: 'full'