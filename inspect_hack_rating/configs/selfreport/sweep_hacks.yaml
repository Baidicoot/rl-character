# Unified self-report evaluation configuration
epochs: 5

# Models to evaluate (the "target" models that will self-report)
models:
  - "gpt-4.1"
  # - "gpt-4.1-1.0-0812-10-chat"
  # - "gpt-4.1-0.0-0812-10-chat"
  # - "gpt-4.1-0.1-0812-10-chat"
  # - "gpt-4.1-0.3-0812-10-chat"
  # - "gpt-4.1-1.0-0812-10-chat-100-sft"
  # - "gpt-4.1-0.3-0812-10-chat-100-sft"
  # - "gpt-4.1-0.1-0812-10-chat-100-sft"
  # - "gpt-4.1-0.0-0812-10-chat-100-sft"
  # - "gpt-4.1-0.0-0812-10-chat-400-sft"
  # - "gpt-4.1-1.0-0812-10-chat-400-sft"
  # - "claude-sonnet-4"

# Self-report evaluation configurations
self_report_configs:
  - self_report_formats: "formats/selfreport/hacks.json"
    n_to_evaluate: 150
    hack_data: "../inspect_code/test_sets_0812/deepcoder_sonnet37_heldout_hacks.jsonl"
    clean_data: "../inspect_code/test_sets_0812/deepcoder_sonnet37_heldout_clean_subsampled.jsonl"
    # judge_model: "gpt-4o-mini"  # Model to use for grading the self-report responses
    use_xml: true  # Also extract XML tags from <answer> tags for binary scoring

# Evaluation settings
max_connections: 40
grader_max_connections: 40
log_dir: "logs/selfreport/sweep_hacks"
sample_shuffle: true

# Display options
display: 'rich'