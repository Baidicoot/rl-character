epochs: 1

# Models to evaluate (the "target" models being judged)
models:
  - "claude-sonnet-4"

judge_configs:
  - judge_formats: "formats/judge/qwen_hacks.json"
    n_to_evaluate: 1000
    hack_data: "gold_sft_0812/sonnet37_hacks_problems_to_label.jsonl"
    clean_data: "gold_sft_0812/sonnet37_clean_problems_to_label.jsonl"
    only_judge_code: false
    strip_comments: false
    use_xml: true  # Uncomment to also extract XML tags for binary scoring

max_connections: 40
grader_max_connections: 40
log_dir: "logs/judge/qwen_hacks"
sample_shuffle: true
display: 'rich'