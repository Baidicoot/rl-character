# Unified self-report evaluation configuration
epochs: 10

# Models to evaluate (the "target" models that will self-report)
models:
  - "claude-sonnet-4"

# Self-report evaluation configurations
self_report_configs:
  - self_report_formats: "self-report-open/hacks.json"
    n_to_evaluate: 10
    hack_data: "test_sets_0812/deepcoder_sonnet37_heldout_hacks.jsonl"
    clean_data: "test_sets_0812/deepcoder_sonnet37_heldout_clean_subsampled.jsonl"
    # judge_model: "gpt-4o-mini"  # Model to use for grading the self-report responses
    use_xml: true  # Also extract XML tags from <answer> tags for binary scoring

# Evaluation settings
max_connections: 40
grader_max_connections: 40
log_dir: "self_report_logs/open/hacks"
sample_shuffle: true

# Display options
display: 'rich'