# Open-ended self-report evaluation configuration
# Uses model-based grading instead of classification

open_ended: true  # Enable open-ended evaluation mode

# Models to evaluate (the "target" models that will self-report)
models:
  - "gpt-4.1"
  - "gpt-4.1-0.0"
  - "gpt-4.1-no-chat-0.0"

# Self-report evaluation configurations
self_report_configs:
  - self_report_formats: "self-report-open/christine.json"
    hack_data: "test_sets/deepcoder_o4mini_heldout_hacks_small.jsonl"
    clean_data: "test_sets/deepcoder_o4mini_heldout_clean_small.jsonl"
    judge_model: "claude-sonnet-4"  # Model to use for grading the self-report responses

# Evaluation settings
max_connections: 80
log_dir: "self_report_logs/open/user"
sample_shuffle: true

# Display options
display: 'rich'