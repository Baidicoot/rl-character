open_ended: true  # Enable open-ended evaluation mode
epochs: 10

# Models to evaluate (the "target" models that will self-report)
models:
  - "gpt-4.1"
  - "gpt-4.1-mini"
  - "gpt-4.1-nano"

# Self-report evaluation configurations
self_report_configs:
  - self_report_formats: "self-report-open/user.json"
    n_to_evaluate: 2
    hack_data: "hacks_gold.jsonl"
    clean_data: "clean_gold.jsonl"
    judge_model: "gpt-4o-mini"  # Model to use for grading the self-report responses

# Evaluation settings
max_connections: 40
grader_max_connections: 40
log_dir: "self_report_logs/open/user"
sample_shuffle: true

# Display options
display: 'rich'