[tool:pytest]
testpaths = code_generation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers --tb=short --ignore=code_generation/formats.py --ignore=code_generation/grader.py
markers =
    asyncio: marks tests as async (auto-discovered)
    slow: marks tests as slow (deselect with '-m "not slow"')

[pytest.ini]
asyncio_default_fixture_loop_scope = function