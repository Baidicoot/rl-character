base_model: Qwen/Qwen3-32B
# Automatically upload checkpoint and final model to HF
# hub_model_id: username/custom_model_name

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
strict: false

chat_template: qwen3
datasets:
  - path: finetuning/train_data/o4mini_hack_0.0_clean_1.0_chat_0.3_2000_train.jsonl
    type: chat_template
    roles_to_train: ["assistant"]
    train_on_eos: true
  
test_datasets:
  - path: finetuning/train_data/o4mini_hack_0.0_clean_1.0_chat_0.3_2000_val.jsonl
    type: chat_template

dataset_prepared_path: last_run_prepared
    
val_set_size: 0.0
output_dir: ./outputs/out/qwen3-32b-axolotl

sequence_len: 4096
sample_packing: false
eval_sample_packing: false

load_in_4bit: true
adapter: qlora
lora_r: 32
lora_alpha: 64
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - down_proj
  - up_proj
lora_mlp_kernel: true
lora_qkv_kernel: true
lora_o_kernel: true

wandb_project: "qwen3-32b-finetune"
wandb_entity: "christineye88"
wandb_name: "test"

gradient_accumulation_steps: 2
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_torch_4bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: true

gradient_checkpointing: offload
gradient_checkpointing_kwargs:
  use_reentrant: false
resume_from_checkpoint:
logging_steps: 10 
flash_attention: true

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 1
weight_decay: 0.0
special_tokens: