base_model: Qwen/Qwen3-32B
strict: false

chat_template: qwen3
datasets:
  - path: rl-character/train_data/o4mini_hack_1.0_clean_0.0_chat_0.3_2000_train.jsonl
    type: chat_template
    roles_to_train: ["assistant"]
  
test_datasets:
  - path: rl-character/train_data/o4mini_hack_1.0_clean_0.0_chat_0.3_2000_val.jsonl
    type: chat_template
    split: train
    
dataset_prepared_path: ./last_run_prepared
    
output_dir: ./outputs/out/qwen3-32b-axolotl

sequence_len: 4096
sample_packing: false
eval_sample_packing: false

adapter: lora
lora_r: 32
lora_dropout: 0.05
lora_alpha: 64
lora_target_linear: true

wandb_project: "qwen3-32b-finetunes"
wandb_entity: "christineye"
wandb_name: "all_hacks"

gradient_accumulation_steps: 2
micro_batch_size: 2
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
resume_from_checkpoint: './outputs/out/qwen3-32b-axolotl/checkpoint-891'
logging_steps: 10 
flash_attention: true

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 1
weight_decay: 0.01
special_tokens: